<script>
// Exponer globalmente para que el bundle pueda llamar
window.cfData=null; window.cfTipo='completa'; window.cfOriginal=800;
let cfData=null, cfTipo='completa', cfOriginal=800;
function cfFormat(n){return Number(n).toFixed(2).replace('.',',')+' €';}
function cfSetTipo(t){
  cfTipo=t; window.cfTipo=t;
  var el100=document.getElementById('cf-opt-100'); if(el100){el100.style.borderColor=t==='completa'?'#2b5cff':'#e5e7eb'; el100.style.background=t==='completa'?'#eef4ff':'white';}
  var c100=document.getElementById('cf-check-100'); if(c100) c100.style.display=t==='completa'?'inline':'none';
  var elPar=document.getElementById('cf-opt-parcial'); if(elPar){elPar.style.borderColor=t==='parcial'?'#fde68a':'#e5e7eb'; elPar.style.background=t==='parcial'?'#fefce8':'white';}
  var fields=document.getElementById('cf-parcial-fields'); if(fields) fields.style.display=t==='parcial'?'flex':'none';
  var elComp=document.getElementById('cf-opt-comp'); if(elComp){elComp.style.borderColor=t==='compensar'?'#f59e0b':'#e5e7eb'; elComp.style.background=t==='compensar'?'#fffbeb':'white';}
  var cComp=document.getElementById('cf-check-comp'); if(cComp) cComp.style.display=t==='compensar'?'inline':'none';
  var btn=document.getElementById('cf-btn-guardar'); if(!btn) return;
  if(t==='completa'){btn.textContent='Devolver 100% · '+cfFormat(cfOriginal); btn.style.background='#2b5cff';}
  else if(t==='parcial'){var dev=parseFloat(document.getElementById('cf-importe-dev').value)||0; var ret=cfOriginal-dev; btn.textContent='Devolver '+cfFormat(dev)+' · Retener '+cfFormat(ret); btn.style.background='#2b5cff';}
  else{btn.textContent='Compensar por impago · '+cfFormat(cfOriginal); btn.style.background='#b45309';}
}
function cfUpdateParcial(){
  var dev=parseFloat(document.getElementById('cf-importe-dev').value)||0;
  if(dev<0)dev=0; if(dev>cfOriginal)dev=cfOriginal;
  var inp=document.getElementById('cf-importe-dev'); if(inp) inp.value=dev;
  var ret=cfOriginal-dev;
  var pct=cfOriginal>0?Math.round(dev/cfOriginal*100):0;
  var chk=document.getElementById('cf-check-parcial'); if(chk) chk.textContent=pct+'% devuelto';
  var calc=document.getElementById('cf-calculo'); if(calc) calc.textContent=pct+'% ('+cfFormat(dev)+' de '+cfFormat(cfOriginal)+') · Retenido '+cfFormat(ret)+' solo Hab '+(cfData?cfData.habId:'');
  if(cfTipo==='parcial'){var btn=document.getElementById('cf-btn-guardar'); if(btn) btn.textContent='Devolver '+cfFormat(dev)+' · Retener '+cfFormat(ret);}
}
window.cfOpenEditor = function(fianza){
  // fianza viene del bundle original con campos: habId, inqNombre, importe, fechaRet, medio, etc
  cfData=fianza; window.cfData=fianza;
  cfOriginal=fianza.importe||800; window.cfOriginal=cfOriginal; window.cfTipo='completa';
  var hab = fianza.habId||'?';
  var nombre = fianza.inqNombre||fianza.activa?.nombre||'Inquilina';
  var imp = fianza.importe||800;
  var fecha = fianza.fechaRet||'';
  var medio = fianza.medio||'Transferencia';

  var title=document.getElementById('cf-title'); if(title) title.textContent='Gestión de fianza - Hab '+hab+' DON RAMÓN';
  var sub=document.getElementById('cf-subtitle'); if(sub) sub.textContent=nombre+' · Fianza de ESTA habitación: '+cfFormat(imp)+' · '+fecha+' · '+medio+' · Solo Hab '+hab;
  var desc100=document.getElementById('cf-desc-100'); if(desc100) desc100.textContent='Se devuelve íntegro · '+cfFormat(imp)+' de Hab '+hab+' · 100% · Solo esta fianza';
  var impDev=document.getElementById('cf-importe-dev'); if(impDev) impDev.value=imp;
  var mot=document.getElementById('cf-motivo'); if(mot) mot.value='Desperfectos';
  var notas=document.getElementById('cf-notas'); if(notas) notas.value='';
  var medioEl=document.getElementById('cf-medio'); if(medioEl) medioEl.value=medio;
  var fechaEl=document.getElementById('cf-fecha'); if(fechaEl) fechaEl.value=new Date().toISOString().slice(0,10);
  var compInfo=document.getElementById('cf-comp-info'); if(compInfo) compInfo.textContent='Se compensará '+cfFormat(imp)+' de Hab '+hab+' · '+nombre+' · Solo esta fianza';
  cfSetTipo('completa'); cfUpdateParcial();
  var overlay=document.getElementById('custom-fianza-overlay'); if(overlay) overlay.style.display='flex';
  console.log('Gestión fianza abierta Hab', hab, 'importe individual', imp);
}
function cfOpenEditor(fianza){ return window.cfOpenEditor(fianza); }

function cfGuardar(){
  if(!cfData) return;
  var dev=cfTipo==='completa'?cfOriginal:cfTipo==='compensar'?0:parseFloat(document.getElementById('cf-importe-dev').value)||0;
  var ret=cfOriginal-dev;
  var motEl=document.getElementById('cf-motivo'); var motivo=cfTipo==='completa'?'Completa':cfTipo==='compensar'?'Compensación último mes':(motEl?motEl.value:'Desperfectos');
  var notasEl=document.getElementById('cf-notas'); var notas=notasEl?notasEl.value:'';
  var medioEl=document.getElementById('cf-medio'); var medio=medioEl?medioEl.value:'Transferencia';
  var fechaEl=document.getElementById('cf-fecha'); var fecha=fechaEl?fechaEl.value:new Date().toISOString().slice(0,10);
  try{
    var raw=localStorage.getItem('donRamonV5');
    var data=raw?JSON.parse(raw):{inquilinas:[],cobrosByMonth:{},compensaciones:{}};
    if(cfTipo==='compensar'){
      var mes='2026-09';
      var mesLabel=document.getElementById('current-month-label');
      if(mesLabel){
        var map={'ENE 2026':'2026-01','FEB 2026':'2026-02','MAR 2026':'2026-03','ABR 2026':'2026-04','MAY 2026':'2026-05','JUN 2026':'2026-06','JUL 2026':'2026-07','AGO 2026':'2026-08','SEPT 2026':'2026-09','OCT 2026':'2026-10','NOV 2026':'2026-11','DIC 2026':'2026-12'};
        if(map[mesLabel.textContent.trim()]) mes=map[mesLabel.textContent.trim()];
      }
      if(!data.compensaciones) data.compensaciones={};
      if(!data.compensaciones[mes]) data.compensaciones[mes]={};
      data.compensaciones[mes][cfData.habId]={importe:cfOriginal,fecha:fecha,motivo:motivo,medio:'Compensación'};
    }else{
      if(data.inquilinas){
        data.inquilinas=data.inquilinas.map(function(inq){ return inq.habitacion===cfData.habId ? Object.assign({}, inq, {fianza:Object.assign({}, inq.fianza, {estado: cfTipo==='completa'?'devuelta':'retenida'})}) : inq; });
      }
    }
    var histKey='donRamonFianzasHistorial';
    var hist=JSON.parse(localStorage.getItem(histKey)||'[]');
    hist.push({id:'hf'+Date.now(),habId:cfData.habId,inquilinaNombre:cfData.inqNombre,importeRetenidoOriginal:cfOriginal,importeDevuelto:dev,importeRetenido:ret,motivo:motivo,medio:medio,fechaDevolucion:fecha,notas:notas,tipo:cfTipo});
    localStorage.setItem(histKey,JSON.stringify(hist));
    localStorage.setItem('donRamonV5',JSON.stringify(data));
    alert('Hab '+cfData.habId+' - Fianza gestionada: '+(cfTipo==='completa'?'100% · '+cfFormat(cfOriginal)+' solo Hab '+cfData.habId:cfTipo==='compensar'?'Compensada Hab '+cfData.habId+' · '+cfFormat(cfOriginal):'Parcial Hab '+cfData.habId+' · Devuelto '+cfFormat(dev)+' · Retenido '+cfFormat(ret)+' · '+motivo));
    document.getElementById('custom-fianza-overlay').style.display='none';
    setTimeout(function(){location.reload();},400);
  }catch(e){alert('Error: '+e.message);}
}
console.log('Parche quirúrgico JS + overlay Gestión fianza individual cargado');
</script>

<script>

function ncoSetEstado(est){
  ncoEstado=est;
  var bC=document.getElementById('nco-est-cobrado');
  var bP=document.getElementById('nco-est-pendiente');
  var bPa=document.getElementById('nco-est-parcial');
  var box=document.getElementById('nco-parcial-box');

    var imp=document.getElementById('nco-importe')?.value||ncoData.importe;

}
window.openCobroNuevoEditor = function(data){

  var title=document.getElementById('nco-title');

  var anoEl=document.getElementById('nco-ano'); if(anoEl) anoEl.value=ano;
  var mesEl=document.getElementById('nco-mes'); if(mesEl) mesEl.value=String(mesNum);
  var impEl=document.getElementById('nco-importe'); if(impEl) impEl.value=data.importe||800;
  var fechaEl=document.getElementById('nco-fecha'); if(fechaEl) fechaEl.value=data.fechaAbono||new Date().toISOString().slice(0,10);
  var metEl=document.getElementById('nco-metodo'); if(metEl) metEl.value=data.metodo||'Transferencia';

function ncoGuardar(){
  if(!ncoData) return;
  var ano=parseInt(document.getElementById('nco-ano').value)||2026;
  var mesNum=parseInt(document.getElementById('nco-mes').value)||9;
  var mesId=ano+'-'+String(mesNum).padStart(2,'0');
  var importe=parseFloat(document.getElementById('nco-importe').value)||0;
  var fecha=document.getElementById('nco-fecha').value||new Date().toISOString().slice(0,10);
  var metodo=document.getElementById('nco-metodo').value||'Transferencia';
  var importeParcial=parseFloat(document.getElementById('nco-importe-parcial').value)||0;
  var motivoParcial=document.getElementById('nco-motivo-parcial').value||'';
  try{
    var raw=localStorage.getItem('donRamonV5');
    var data=raw?JSON.parse(raw):{};
    if(!data.cobrosByMonth) data.cobrosByMonth={};
    if(!data.cobrosByMonth[mesId]) data.cobrosByMonth[mesId]=[];
    var list=data.cobrosByMonth[mesId];
    var idx=list.findIndex(c=>c.habitacion===ncoData.habId);
    var newEntry={
      habitacion:ncoData.habId,
      inquilinaId:'h'+ncoData.habId,
      amount:importe,
      status: ncoEstado==='parcial' ? 'parcial' : (ncoEstado==='cobrado' ? 'cobrado' : 'pendiente'),
      fechaAbono: ncoEstado==='pendiente' ? null : fecha,
      metodo: metodo,
      importeParcial: ncoEstado==='parcial' ? importeParcial : null,
      motivoParcial: ncoEstado==='parcial' ? motivoParcial : null,
      updatedAt: new Date().toISOString()
    };
    if(idx>=0) list[idx]=Object.assign({}, list[idx], newEntry);
    else list.push(newEntry);
    data.cobrosByMonth[mesId]=list;
    localStorage.setItem('donRamonV5', JSON.stringify(data));
    console.log('Cobro guardado', newEntry);
    alert('✓ Guardado Hab '+ncoData.habId+' · '+mesId+' · '+importe+'€ · '+ncoEstado);
    document.getElementById('custom-cobro-nuevo-overlay').style.display='none';
    setTimeout(()=>{location.reload();},500);
  }catch(e){ alert('Error: '+e.message); }
}

// INYECCION AGRESIVA - BUSCA TODOS LOS BOTONES EDITAR EN TODA LA APP
function injectEditarButtons(){
  // Buscar todos los botones cuyo texto sea exactamente Editar
  var allBtns=document.querySelectorAll('button');
  var patched=0;
  for(var i=0;i<allBtns.length;i++){
    var btn=allBtns[i];
    var txt=(btn.textContent||'').trim();
    if(txt==='Editar' && !btn.dataset.ncoPatched){
      // Verificar que está dentro de una tarjeta con Habitación o importe
      var parentText=(btn.parentElement?.parentElement?.textContent||'');
      // Si estamos en Dashboard Cobros pastilla, parentText contiene Habitación y €
      var isCobrosCard = (parentText.indexOf('Habitación')!==-1 || document.body.textContent.indexOf('Gestión directa de cobros')!==-1);
      // Para ser más agresivo, parcheamos TODOS los Editar que estén en un fixed (modal)
      var inFixed=false;
      var p=btn.parentElement;
      var depth=0;
      while(p && depth<8){
        if(p.className && p.className.indexOf('fixed')!==-1){ inFixed=true; break; }
        p=p.parentElement; depth++;
      }
      if(!inFixed && !isCobrosCard) continue; // solo modales

      // Extraer datos
      var card=btn.parentElement;
      var d=0;
      while(card && d<15){
        var ct=card.textContent||'';
        if(ct.indexOf('Habitación')!==-1 && ct.indexOf('€')!==-1){ break; }
        card=card.parentElement; d++;
      }
      var habId=1, inqNombre='Inquilina', importe=800, fechaAbono='2026-09-03', metodo='Transferencia', mesId='2026-09', status='cobrado';
      try{
        if(card){
          var full=card.textContent||'';
          var mHab=full.match(/Habitación\s+(\d+)/); if(mHab) habId=parseInt(mHab[1]);
          // Buscar nombre - primer div con 2 palabras y sin € ni Habitación
          var divs=card.querySelectorAll('div');
          for(var k=0;k<divs.length;k++){
            var t=divs[k].textContent.trim();
            if(t.length>4 && t.length<40 && t.indexOf('Habitación')===-1 && t.indexOf('€')===-1 && t.indexOf('Cobro')===-1 && t.split(' ').length>=2){
              if(t.indexOf('Ficha')===-1 && t.indexOf('Editar')===-1){ inqNombre=t; break; }
            }
          }
          var mImp=full.match(/(\d+)\s*€/); if(mImp){ var nn=parseInt(mImp[1]); if(nn>=500 && nn<=1200) importe=nn; }
          // Mes desde cualquier parte de la pagina que diga Cobros -
          var bodyTxt=document.body.textContent||'';
          var mMes=bodyTxt.match(/Cobros -\s*([A-Z]+\s+\d+)/);
          if(mMes){
            var map={'ENE 2026':'2026-01','FEB 2026':'2026-02','MAR 2026':'2026-03','ABR 2026':'2026-04','MAY 2026':'2026-05','JUN 2026':'2026-06','JUL 2026':'2026-07','AGO 2026':'2026-08','SEPT 2026':'2026-09','OCT 2026':'2026-10','NOV 2026':'2026-11','DIC 2026':'2026-12'};
            var key=mMes[1].trim(); if(map[key]) mesId=map[key];
          }
        }
      }catch(e){}

      // Clonar y reemplazar
      var newBtn=btn.cloneNode(true);
      newBtn.textContent='✏️ Editar cobro';
      newBtn.style.background='white';
      newBtn.style.border='1px solid #2b5cff';
      newBtn.style.color='#2b5cff';
      newBtn.style.fontWeight='800';
      newBtn.dataset.ncoPatched='1';
      (function(h,iN,imp,fa,me,mi,sta,origBtn){
        newBtn.addEventListener('click', function(ev){
          if(ev){ ev.stopPropagation(); ev.preventDefault(); }
          console.log('>>> Editar clicked - abriendo nuevo editor', h, imp, mi);
          window.openCobroNuevoEditor({habId:h, inqNombre:iN, importe:imp, fechaAbono:fa, metodo:me, mesId:mi, status:sta});
        });
      })(habId, inqNombre, importe, fechaAbono, metodo, mesId, status, btn);

      if(btn.parentNode){
        btn.parentNode.replaceChild(newBtn, btn);
        patched++;
        console.log('✓ Patched Editar Hab', habId, 'importe', importe);
      }
    }
  }
  if(patched>0) console.log('Total patched', patched);
}

setInterval(injectEditarButtons, 600);
console.log('V10 nuevo editor cobros cargado - inyeccion agresiva');
</script>

function fmt(n){ return Number(n||0).toFixed(2).replace('.',',')+' €'; }
function calcAno(ano){
  let {cobrosByMonth, gastosV12, fiscal} = getData();
  let ingresosPorMes={}; let totalIngresos=0;
  for(let m=1;m<=12;m++){
    let mesId = ano+"-"+String(m).padStart(2,'0');
    let list = cobrosByMonth[mesId] || [];
    let sum=0;
    if(list.length===0 && ano==="2026"){
      let defaults={"01":3800,"02":3800,"03":3800,"04":3800,"05":3800,"06":3100,"07":3100,"08":2675,"09":3900,"10":0,"11":0,"12":0};
      sum=defaults[String(m).padStart(2,'0')]||0;
    } else {
      sum=list.reduce((a,c)=>a+Number(c.amount||0),0);
    }
    ingresosPorMes[m]=sum; totalIngresos+=sum;
  }
  let gastosPorCat={}; let gastosPorMesCat={}; let totalGastos=0;
  let gAno=(gastosV12[ano]||{});
  CATEGORIAS.forEach(cat=>{
    let catData=gAno[cat]||{}; let totalCat=0; let porMes={};
    for(let m=1;m<=12;m++){ let key=String(m).padStart(2,'0'); let v=Number(catData[key]||0); porMes[m]=v; totalCat+=v; }
    gastosPorCat[cat]=totalCat; gastosPorMesCat[cat]=porMes; totalGastos+=totalCat;
  });
  let beneficioAntes=totalIngresos-totalGastos;
  let impactoFiscal=(fiscal[ano]?.impactoFiscal)||0;
  let beneficioDespues=beneficioAntes-impactoFiscal;
  return {ingresosPorMes, totalIngresos, gastosPorCat, gastosPorMesCat, totalGastos, beneficioAntes, impactoFiscal, beneficioDespues};
}

window.rentV12EditarFiscal=function(){
  let ano="2026"; let data=getData(); let actual=data.fiscal[ano]?.impactoFiscal||0;
  let nuevo=prompt("Impacto fiscal orientativo para "+ano+" (€):", actual);
  if(nuevo===null) return;
  let num=parseFloat(nuevo.replace(',','.'))||0;
  data.fiscal[ano].impactoFiscal=num;
  localStorage.setItem('donRamonFiscalV12', JSON.stringify(data.fiscal));
  rentV12RenderResumen();
};
window.openRentabilidadV12=function(){
  rentV12RenderResumen();
  document.getElementById('rentabilidad-v12-overlay').style.display='flex';
};
// INYECTOR - PASTILLA RENTABILIDAD NETA NO TIENE ONCLICK EN BASE
function injectRentV12(){
  try{
    document.querySelectorAll('div').forEach(div=>{
      let t=(div.textContent||'');
      if(t.indexOf('Rentabilidad neta')!==-1 && t.indexOf('€')!==-1 && t.length<200){
        let card=div;
        let depth=0;
        while(card && depth<6){
          if(card.className && card.className.indexOf('rounded-[20px]')!==-1 && card.className.indexOf('bg-white')!==-1){ break; }
          card=card.parentElement; depth++;
        }
        if(card && !card.dataset.rentV12Patched){
          card.dataset.rentV12Patched='1';
          card.style.cursor='pointer';
          card.addEventListener('click', function(e){ e.stopPropagation(); e.preventDefault(); window.openRentabilidadV12(); });
          // Añadir indicador si no existe
          if(card.textContent.indexOf('Ver rentabilidad')===-1){
            let ind=document.createElement('div');
            ind.textContent='↗ Ver rentabilidad anual';
            ind.style.cssText='margin-top:8px; font-size:11px; font-weight:700; color:#2b5cff;';
            card.appendChild(ind);
          }
          console.log('✓ Rentabilidad V12 patched');
        }
      }
    });
  }catch(e){ console.error(e); }
}
setInterval(injectRentV12, 800);
setTimeout(injectRentV12, 600);
console.log('Rentabilidad V12 LIMPIA cargada - 3 botones');
})();
